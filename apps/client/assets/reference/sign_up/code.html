<style>
    * {
      border-radius: 0px !important;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffdad8;
      -webkit-box-shadow: 0 0 0px 1000px #310004 inset;
      transition: background-color 5000s ease-in-out 0s;
    }
    .brutalist-btn-shadow {
      box-shadow: 4px 4px 0px #4b463b;
    }
    .brutalist-btn-shadow:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #4b463b;
    }

<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-secondary selection:text-on-secondary">
<!-- Top Bar: Minimal Architectural Header -->
<header class="w-full h-14 border-b border-outline-variant px-margin flex items-center justify-between bg-background sticky top-0 z-40">
<button aria-label="Go Back" class="flex items-center justify-center w-8 h-8 text-on-surface hover:text-secondary active:translate-x-0.5 active:translate-y-0.5 transition-transform" type="button">
<span class="material-symbols-outlined text-lg" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex items-center">
<span class="font-headline-sm text-headline-sm font-bold tracking-tight text-on-surface uppercase">CRACKR</span>
</div>
<div class="w-8 h-8 flex items-center justify-end">
<span class="font-label-code text-label-code text-secondary tracking-widest uppercase font-semibold">02</span>
</div>
</header>
<!-- Main Canvas -->
<main class="w-full flex-1 px-margin py-space-lg flex flex-col justify-start max-w-md mx-auto">
<!-- Editorial Diagnostic Badge -->
<div class="flex items-center gap-space-xs mb-space-sm">
<span class="w-1.5 h-1.5 bg-secondary"></span>
<span class="font-label-code text-label-code text-on-surface-variant uppercase tracking-widest font-semibold">
        NEW ASPIRANT // REGISTRATION
      </span>
</div>
<!-- Oversized Editorial Headline -->
<div class="mb-space-xl border-l-2 border-secondary pl-space-sm">
<h1 class="font-display-hero-mobile text-display-hero-mobile font-extrabold text-on-surface tracking-tight leading-none uppercase">
        JOIN THE<br/>SPRINT.
      </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-space-xs">
        Phase II high-intensity mock portal. Academic syllabus tracking enabled.
      </p>
</div>
<!-- Registration Form -->
<form class="flex flex-col space-y-space-lg" onsubmit="event.preventDefault();">
<!-- Field: FULL NAME -->
<div class="flex flex-col group">
<label class="font-label-code text-label-code text-on-surface-variant uppercase tracking-widest mb-space-2xs group-focus-within:text-secondary transition-colors" for="full_name">
          FULL NAME
        </label>
<div class="relative flex items-center">
<input autocomplete="name" class="w-full bg-transparent border-0 border-b border-outline-variant py-space-sm px-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-0 focus:border-secondary transition-colors uppercase tracking-wider" id="full_name" name="full_name" placeholder="E.G. AARAV SHARMA" required="" type="text"/>
<span class="material-symbols-outlined text-outline-variant text-base absolute right-0 pointer-events-none group-focus-within:text-secondary" data-icon="badge">badge</span>
</div>
</div>
<!-- Field: EMAIL ADDRESS -->
<div class="flex flex-col group">
<label class="font-label-code text-label-code text-on-surface-variant uppercase tracking-widest mb-space-2xs group-focus-within:text-secondary transition-colors" for="email_address">
          EMAIL ADDRESS
        </label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full bg-transparent border-0 border-b border-outline-variant py-space-sm px-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-0 focus:border-secondary transition-colors lowercase tracking-normal" id="email_address" name="email_address" placeholder="ASPIRANT@DOMAINGROUP.IN" required="" type="email"/>
<span class="material-symbols-outlined text-outline-variant text-base absolute right-0 pointer-events-none group-focus-within:text-secondary" data-icon="alternate_email">alternate_email</span>
</div>
</div>
<!-- Field: CREATE PASSWORD -->
<div class="flex flex-col group">
<label class="font-label-code text-label-code text-on-surface-variant uppercase tracking-widest mb-space-2xs group-focus-within:text-secondary transition-colors" for="password">
          CREATE PASSWORD
        </label>
<div class="relative flex items-center">
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-space-sm pr-14 pl-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-0 focus:border-secondary transition-colors" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 font-label-code text-label-code text-on-surface-variant hover:text-secondary px-space-xs py-space-2xs border border-outline-variant uppercase transition-colors" id="togglePassword" onclick="toggleVisibility('password', this)" type="button">
            SHOW
          </button>
</div>
</div>
<!-- Field: CONFIRM PASSWORD -->
<div class="flex flex-col group">
<label class="font-label-code text-label-code text-on-surface-variant uppercase tracking-widest mb-space-2xs group-focus-within:text-secondary transition-colors" for="confirm_password">
          CONFIRM PASSWORD
        </label>
<div class="relative flex items-center">
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-space-sm px-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-0 focus:border-secondary transition-colors" id="confirm_password" name="confirm_password" placeholder="••••••••••••" required="" type="password"/>
<span class="material-symbols-outlined text-outline-variant text-base absolute right-0 pointer-events-none group-focus-within:text-secondary" data-icon="lock">lock</span>
</div>
</div>
<!-- Terms Checkbox (Sharp Brutalist Square) -->
<div class="pt-space-xs">
<label class="flex items-start gap-space-sm cursor-pointer select-none">
<input class="mt-1 w-4 h-4 rounded-none border border-outline-variant bg-surface-container text-secondary focus:ring-0 focus:ring-offset-0 transition-colors" id="terms" required="" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant leading-tight">
            I agree to NTA JEE curriculum guidelines &amp; terms
          </span>
</label>
</div>
<!-- Primary Solid Button -->
<div class="pt-space-sm">
<button class="w-full bg-secondary text-on-secondary hover:bg-secondary-fixed active:bg-secondary border border-secondary font-headline-sm text-headline-sm font-bold uppercase tracking-wider py-space-md flex items-center justify-center gap-space-sm brutalist-btn-shadow transition-transform duration-70" type="submit">
<span>CREATE ACCOUNT</span>
<span class="material-symbols-outlined font-bold text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Divider Rule -->
<div class="relative flex items-center justify-center my-space-md">
<div class="w-full border-t border-outline-variant"></div>
<span class="absolute bg-background px-space-md font-label-code text-label-code text-on-surface-variant uppercase tracking-widest">
          OR CONTINUE WITH
        </span>
</div>
<!-- Outline Button: Google Provider -->
<div>
<button class="w-full bg-transparent border border-outline-variant hover:border-on-surface hover:bg-surface-container active:translate-x-0.5 active:translate-y-0.5 text-on-surface font-headline-sm text-headline-sm font-semibold uppercase tracking-wider py-space-md flex items-center justify-center gap-space-sm transition-all" type="button">
<!-- Minimalist Google Monochromatic SVG Icon -->
<svg aria-hidden="true" class="w-4 h-4 fill-current text-on-surface" viewbox="0 0 24 24">
<path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"></path>
</svg>
<span>CONTINUE WITH GOOGLE</span>
</button>
</div>
</form>
</main>
<!-- Bottom Prompt & System Footnote -->
<footer class="w-full border-t border-outline-variant py-space-md px-margin text-center bg-background mt-space-xl">
<p class="font-body-md text-body-md text-on-surface-variant">
      Already registered? 
      <a class="text-secondary font-headline-sm text-body-md font-bold uppercase tracking-wider hover:underline ml-space-2xs inline-block" href="#login">
        Log in
      </a>
</p>
<div class="mt-space-xs">
<span class="font-label-code text-label-code text-outline-variant tracking-widest uppercase">
        NTA STANDARDS // SECURE TERMINAL
      </span>
</div>
</footer>
<!-- Inline Micro-interaction Script -->
<script>
    function toggleVisibility(inputId, btnElement) {
      const field = document.getElementById(inputId);
      if (!field) return;
      if (field.type === 'password') {
        field.type = 'text';
        btnElement.textContent = 'HIDE';
        btnElement.classList.add('text-secondary', 'border-secondary');
      } else {
        field.type = 'password';
        btnElement.textContent = 'SHOW';
        btnElement.classList.remove('text-secondary', 'border-secondary');
      }
    }
  </script>
</body></html>
